name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (requires PYPI_API_TOKEN secret)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]" || python -m pip install -e .

      - name: Run unit test suite
        run: |
          python -m unittest discover tests

  build-and-release:
    name: Build Wheel & Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and universal wheel
        run: |
          python -m build

      - name: Check distribution artifacts
        run: |
          twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/smoke_env
          /tmp/smoke_env/bin/pip install dist/*.whl
          /tmp/smoke_env/bin/hex --help
          /tmp/smoke_env/bin/hex doctor --json

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            install.sh
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: ${{ (inputs.publish_pypi == true || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_PYPI_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        env:
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
