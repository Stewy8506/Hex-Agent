name: Release & Publish

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish to PyPI (requires PYPI_API_TOKEN secret)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  verify:
    name: Verify Tests Before Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]"

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      - name: Run unit test suite
        run: |
          set -o pipefail
          python -m pytest tests -v 2>&1 | tee test_run.log || {
            echo "### ❌ Test Suite Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail_err=$(tail -n 25 test_run.log | tr '\n' ' ')
            echo "::error title=Test Failure::$tail_err"
            exit 1
          }

  build-native:
    name: Build Native Cockpit (${{ matrix.tag }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x86_64
          - os: ubuntu-24.04-arm
            tag: linux-arm64
          - os: macos-latest
            tag: macos-arm64
          - os: macos-latest
            tag: macos-x86_64
            rust_target: x86_64-apple-darwin
          - os: windows-latest
            tag: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target || '' }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Build hex-tui (release)
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_target }}" ]; then
            cargo build --release -p hex-tui --target "${{ matrix.rust_target }}"
            echo "BIN_DIR=target/${{ matrix.rust_target }}/release" >> "$GITHUB_ENV"
          else
            cargo build --release -p hex-tui
            echo "BIN_DIR=target/release" >> "$GITHUB_ENV"
          fi

      - name: Package artifact with SHA-256 (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p native
          tar -czf "native/hex-tui-${{ matrix.tag }}.tar.gz" -C "$BIN_DIR" hex-tui
          shasum -a 256 "native/hex-tui-${{ matrix.tag }}.tar.gz" > "native/hex-tui-${{ matrix.tag }}.tar.gz.sha256"

      - name: Package artifact with SHA-256 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path native -Force | Out-Null
          Compress-Archive -Path "$env:BIN_DIR/hex-tui.exe" -DestinationPath "native/hex-tui-${{ matrix.tag }}.zip"
          $hash = (Get-FileHash "native/hex-tui-${{ matrix.tag }}.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "native/hex-tui-${{ matrix.tag }}.zip.sha256" -Value "$hash  hex-tui-${{ matrix.tag }}.zip"

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: hex-tui-${{ matrix.tag }}
          path: native/*
          if-no-files-found: error

  build-and-release:
    name: Build Wheel & Create GitHub Release
    needs: [verify, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build sdist and universal wheel
        run: |
          python -m build

      - name: Check distribution artifacts
        run: |
          twine check dist/*

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/smoke_env
          /tmp/smoke_env/bin/pip install --upgrade pip
          WHEEL=$(ls dist/*.whl | head -n 1)
          /tmp/smoke_env/bin/pip install "${WHEEL}[full]"
          /tmp/smoke_env/bin/hex --help
          /tmp/smoke_env/bin/hex doctor --json

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native
          merge-multiple: true

      - name: Smoke test install contract (isolated home, outside checkout, no compiler)
        run: |
          ISO_HOME=$(mktemp -d)
          ISO_WS=$(mktemp -d)
          mkdir -p "$ISO_HOME/.hex/bin"
          tar -xzf native/hex-tui-linux-x86_64.tar.gz -C "$ISO_HOME/.hex/bin"
          chmod +x "$ISO_HOME/.hex/bin/hex-tui"
          cd "$ISO_WS"
          env -i HOME="$ISO_HOME" PATH="/usr/bin:/bin" /tmp/smoke_env/bin/hex tui --check
          env -i HOME="$ISO_HOME" PATH="/usr/bin:/bin" /tmp/smoke_env/bin/hex doctor --json

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            install.sh
            install.ps1
            native/*.tar.gz
            native/*.zip
            native/*.sha256
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        if: ${{ (inputs.publish_pypi == true || startsWith(github.ref, 'refs/tags/v')) && env.HAVE_PYPI_TOKEN == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
        env:
          HAVE_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}
