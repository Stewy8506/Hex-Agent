name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]"

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      - name: Run test suite
        run: |
          python -m unittest discover -v tests 2>&1 | tee test_run.log || {
            echo "### ❌ Test Suite Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail_err=$(tail -n 25 test_run.log | tr '\n' ' ')
            echo "::error title=Test Failure::$tail_err"
            exit 1
          }

      - name: Verify CLI Entrypoint
        run: |
          which hex || echo "hex binary not found in PATH"
          hex --help
          if ! hex doctor 2>&1 | tee doctor_run.log; then
            echo "### ❌ Hex Doctor Report (Degraded)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat doctor_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            err_msg=$(grep -E "✗|FAILED|Error|error" doctor_run.log | head -n 5 | tr '\n' ' ')
            echo "::error title=Hex Doctor Issue::${err_msg:-Hex Doctor reported errors}"
            exit 1
          fi
