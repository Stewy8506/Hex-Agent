name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[full]"

      - name: Build native Rust TUI
        run: cargo build -p hex-tui

      - name: Test Rust protocol and TUI crates
        run: cargo test -p hex-protocol -p hex-tui

      # GPUI needs the macOS toolchain/Metal; the desktop lane is macOS-only
      # until Linux system-dependency support is verified.
      - name: Build native Rust desktop (macOS)
        if: runner.os == 'macOS'
        run: cargo build -p hex-desktop

      - name: Test Rust desktop crate (macOS)
        if: runner.os == 'macOS'
        run: cargo test -p hex-desktop

      - name: Configure Git Committer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "*"

      # pytest collects both pytest-style functions and unittest.TestCase
      # classes; unittest discovery silently skipped the pytest-style modules.
      - name: Run test suite
        env:
          HEX_TESTING: "1"
        run: |
          set -o pipefail
          python -m pytest tests -v 2>&1 | tee test_run.log || {
            echo "### ❌ Test Suite Failed" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            fail_msg=$(grep -E "^FAILED" test_run.log | head -n 35 | tr '\n' ' ')
            echo "::error title=Test Failure::${fail_msg:-Test suite failed. Check step summary.}"
            exit 1
          }

      - name: Verify CLI Entrypoint
        env:
          HEX_TESTING: "1"
        run: |
          which hex || echo "hex binary not found in PATH"
          hex --help
          if ! hex doctor 2>&1 | tee doctor_run.log; then
            echo "### ❌ Hex Doctor Report (Degraded)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat doctor_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            err_msg=$(grep -E "✗|FAILED|Error|error" doctor_run.log | head -n 5 | tr '\n' ' ')
            echo "::error title=Hex Doctor Issue::${err_msg:-Hex Doctor reported errors}"
            exit 1
          fi
