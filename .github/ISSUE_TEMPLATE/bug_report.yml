name: Bug Report
description: Report a crash, regression, or unexpected behavior in HEX Agent
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which HEX component is affected?
      options:
        - hex-core (Python orchestrator / runtime)
        - hex-desktop (macOS GPUI app)
        - hex-tui (Rust Ratatui TUI)
        - hex-protocol (ACP JSON-RPC wire contract)
        - hex-cli (CLI / onboarding / doctor)
        - hex-skills-builtin / skill_engine
        - hex-graphify (AST code intelligence)
        - hex-skillspector (security gate)
        - cloud / P2P sync / team mesh
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `hex ...`
        2. Trigger action ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Python version, Rust version, and HEX version (`hex --version`).
      placeholder: "macOS 15 (arm64), Python 3.12, Rust 1.82, hex-ai 0.22.0"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Diagnostics
      description: Paste sanitized error output or `hex doctor` output (please remove any API keys or secrets).
      render: shell
