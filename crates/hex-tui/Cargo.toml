[package]
name = "hex-tui"
version = "0.1.0"
edition = "2021"
description = "Native Rust Terminal Cockpit (Ratatui + Crossterm) for HEX Agent"

[dependencies]
hex-protocol = { path = "../hex-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
unicode-width = "0.1"
unicode-segmentation = "1.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
termwiz = { version = "=0.23.3", default-features = false }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse"] }

[lib]
name = "hex_tui"
path = "src/lib.rs"

[[bin]]
name = "hex-tui"
path = "src/main.rs"
