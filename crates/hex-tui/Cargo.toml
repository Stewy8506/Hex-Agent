[package]
name = "hex-tui"
version = "0.1.0"
edition = "2021"
description = "Native Rust Terminal Cockpit (Ratatui + Crossterm) for HEX Autonomous AI Workbench"

[dependencies]
hex-protocol = { path = "../hex-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1.0", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
unicode-width = "0.1"

[lib]
name = "hex_tui"
path = "src/lib.rs"

[[bin]]
name = "hex-tui"
path = "src/main.rs"
