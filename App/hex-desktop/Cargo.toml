[package]
name = "hex-desktop"
version = "0.1.0"
edition = "2021"
description = "Native macOS Metal-accelerated desktop cockpit for HEX Agent using GPUI"

[dependencies]
gpui = "0.2.2"
hex-protocol = { path = "../../crates/hex-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"
futures = "0.3"
unicode-segmentation = "1.10"
log = "0.4"
rfd = "0.15"

[dev-dependencies]
tempfile = "3.8"
gpui = { version = "0.2.2", features = ["test-support"] }
