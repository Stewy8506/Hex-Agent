<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 670" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>
    <linearGradient id="bannerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd000"/>
      <stop offset="50%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#ff9000"/>
      <stop offset="100%" stop-color="#e04000"/>
    </linearGradient>

    <style type="text/css">
      <![CDATA[
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 11.8px; }
      .mono-sm { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 11px; }
      .mono-xs { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 10px; }
      .mono-bold { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace; font-size: 11.8px; font-weight: 700; }
      .cursor-blink { animation: blink 1s step-end infinite; }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

      /* Multi-Stage Dynamic Animation Loop (12s total) */
      /* Phase 1: Ghost prompt in 'plan' mode (0s - 3s) */
      /* Phase 2: Tab to 'agent' mode and typing prompt (3s - 5.5s) */
      /* Phase 3: Executing task and live activity feed (5.5s - 9.5s) */
      /* Phase 4: Task verified and ready (9.5s - 12s) */

      .anim-stage-idle { animation: stageIdle 12s infinite; }
      .anim-stage-typing { animation: stageTyping 12s infinite; }
      .anim-stage-exec { animation: stageExec 12s infinite; }
      .anim-stage-done { animation: stageDone 12s infinite; }

      @keyframes stageIdle {
        0%, 24% { opacity: 1; visibility: visible; }
        25%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes stageTyping {
        0%, 24% { opacity: 0; visibility: hidden; }
        26%, 45% { opacity: 1; visibility: visible; }
        47%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes stageExec {
        0%, 46% { opacity: 0; visibility: hidden; }
        48%, 78% { opacity: 1; visibility: visible; }
        80%, 100% { opacity: 0; visibility: hidden; }
      }
      @keyframes stageDone {
        0%, 79% { opacity: 0; visibility: hidden; }
        81%, 98% { opacity: 1; visibility: visible; }
        100% { opacity: 0; visibility: hidden; }
      }
      ]]>
    </style>
  </defs>

  <!-- Outer macOS Terminal Window Frame -->
  <rect width="980" height="670" rx="10" fill="url(#termBg)" stroke="#2d3548" stroke-width="1.2"/>

