<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#111726"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="50%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <style>
      .mono-title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; font-weight: 700; }
      .mono-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 10.5px; }
      .flow-line {
        stroke-dasharray: 7 7;
        animation: flowAnim 1.8s linear infinite;
      }
      @keyframes flowAnim {
        to { stroke-dashoffset: -28; }
      }
    </style>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#archBg)" stroke="#263147" stroke-width="1.5"/>

  <!-- Header -->
  <text x="500" y="34" text-anchor="middle" class="mono-title" fill="#94a3b8" letter-spacing="1.5">HEX FIVE-STAGE PROOF-CARRYING EXECUTION PIPELINE</text>

  <!-- Connecting Animated Arrows -->
  <g fill="none" stroke="url(#pipeGrad)" stroke-width="2.2">
    <line class="flow-line" x1="190" y1="135" x2="220" y2="135"/>
    <line class="flow-line" x1="380" y1="135" x2="410" y2="135"/>
    <line class="flow-line" x1="570" y1="135" x2="600" y2="135"/>
    <line class="flow-line" x1="760" y1="135" x2="790" y2="135"/>
  </g>

  <!-- Stage 1: Intake & Fast-Path -->
  <g transform="translate(25, 60)">
    <rect width="165" height="150" rx="10" fill="#131b2e" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="20" rx="4" fill="#f59e0b" fill-opacity="0.18"/>
    <text x="20" y="26" class="mono-sub" fill="#fbbf24">STAGE 01</text>
    <text x="12" y="54" class="mono-title" fill="#f8fafc">Intake &amp; Triage</text>
    <text x="12" y="76" class="mono-sub" fill="#94a3b8">• R0/R1 Fast-Path</text>
    <text x="12" y="94" class="mono-sub" fill="#94a3b8">• SkillSpector Gate</text>
    <text x="12" y="112" class="mono-sub" fill="#94a3b8">• CAS Lease Claim</text>
    <text x="12" y="134" class="mono-sub" fill="#fbbf24">&lt;50ms Static Scan</text>
  </g>

  <!-- Stage 2: CoW & 0ms Gateway -->
  <g transform="translate(215, 60)">
    <rect width="165" height="150" rx="10" fill="#131b2e" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="20" rx="4" fill="#38bdf8" fill-opacity="0.18"/>
    <text x="20" y="26" class="mono-sub" fill="#38bdf8">STAGE 02</text>
    <text x="12" y="54" class="mono-title" fill="#f8fafc">CoW &amp; Gateway</text>
    <text x="12" y="76" class="mono-sub" fill="#94a3b8">• APFS / OverlayFS</text>
    <text x="12" y="94" class="mono-sub" fill="#94a3b8">• Bubblewrap / OCI</text>
    <text x="12" y="112" class="mono-sub" fill="#94a3b8">• R0–R4 Policy Guard</text>
    <text x="12" y="134" class="mono-sub" fill="#38bdf8">0ms Journal Replay</text>
  </g>

  <!-- Stage 3: Active Graphify AST -->
  <g transform="translate(405, 60)">
    <rect width="165" height="150" rx="10" fill="#131b2e" stroke="#00f5d4" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="20" rx="4" fill="#00f5d4" fill-opacity="0.18"/>
    <text x="20" y="26" class="mono-sub" fill="#00f5d4">STAGE 03</text>
    <text x="12" y="54" class="mono-title" fill="#f8fafc">Active Graphify</text>
    <text x="12" y="76" class="mono-sub" fill="#94a3b8">• Tree-sitter AST</text>
    <text x="12" y="94" class="mono-sub" fill="#94a3b8">• Blast-Radius Calc</text>
    <text x="12" y="112" class="mono-sub" fill="#94a3b8">• Pre-Flight Guard</text>
    <text x="12" y="134" class="mono-sub" fill="#00f5d4">71.5x Fewer Tokens</text>
  </g>

  <!-- Stage 4: Two-Tier Model Router -->
  <g transform="translate(595, 60)">
    <rect width="165" height="150" rx="10" fill="#131b2e" stroke="#a855f7" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="20" rx="4" fill="#a855f7" fill-opacity="0.18"/>
    <text x="20" y="26" class="mono-sub" fill="#d8b4fe">STAGE 04</text>
    <text x="12" y="54" class="mono-title" fill="#f8fafc">Two-Tier Router</text>
    <text x="12" y="76" class="mono-sub" fill="#94a3b8">• Tier-1 M4 MLX</text>
    <text x="12" y="94" class="mono-sub" fill="#94a3b8">• Tier-2 Cloud API</text>
    <text x="12" y="112" class="mono-sub" fill="#94a3b8">• Privacy Gate</text>
    <text x="12" y="134" class="mono-sub" fill="#d8b4fe">&gt;70% Log + 90% Cache</text>
  </g>

  <!-- Stage 5: Proof & Self-Healing -->
  <g transform="translate(785, 60)">
    <rect width="190" height="150" rx="10" fill="#131b2e" stroke="#10b981" stroke-width="1.5"/>
    <rect x="12" y="12" width="64" height="20" rx="4" fill="#10b981" fill-opacity="0.18"/>
    <text x="20" y="26" class="mono-sub" fill="#6ee7b7">STAGE 05</text>
    <text x="12" y="54" class="mono-title" fill="#f8fafc">Proof &amp; Harness²</text>
    <text x="12" y="76" class="mono-sub" fill="#94a3b8">• Autonomous Repair</text>
    <text x="12" y="94" class="mono-sub" fill="#94a3b8">• Speculative Best-of-N</text>
    <text x="12" y="112" class="mono-sub" fill="#94a3b8">• Signed Proof Bundle</text>
    <text x="12" y="134" class="mono-sub" fill="#6ee7b7">Zero-Regression Merge</text>
  </g>

  <!-- Bottom Telemetry Legend -->
  <text x="500" y="248" text-anchor="middle" class="mono-sub" fill="#64748b">
    PostgreSQL 16 (SKIP LOCKED) / SQLite WAL  ·  Monotonic CAS Fencing Tokens  ·  Telegram &amp; Discord Bidirectional Gateways
  </text>
</svg>
