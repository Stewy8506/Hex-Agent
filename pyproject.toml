[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-ai"
version = "0.22.0"
description = "HEX Agent with CoW durability, Call-Level Journaling, Active Graphify, SkillSpector gate, and Two-Tier model routing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "backports.strenum>=1.2.8; python_version < '3.11'",
    "regex>=2023.12.25; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/Stewy8506/Harness"
Repository = "https://github.com/Stewy8506/Harness"
Issues = "https://github.com/Stewy8506/Harness/issues"

[project.optional-dependencies]
tui = ["rich>=13.0.0"]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.7.0"]
postgres = ["asyncpg>=0.29.0", "sqlalchemy[asyncio]>=2.0.30,<2.1.0", "alembic>=1.13.0"]
mlx = ["mlx-lm>=0.18.0"]
full = [
    "pytest>=7.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "alembic>=1.13.0",
]
test = [
    "pytest>=7.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "alembic>=1.13.0",
]

[project.scripts]
hex = "harness_core.client.cli:main"
harness = "harness_core.client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false
py-modules = []
packages = [
    "harness_core",
    "harness_core.capabilities",
    "harness_core.capabilities.gateways",
    "harness_core.client",
    "harness_core.client.commands",
    "harness_core.client.onboarding",
    "harness_core.client.terminal",
    "harness_core.cognition",
    "harness_core.core",
    "harness_core.gateways",
    "harness_core.lsp",
    "harness_core.models",
    "harness_core.platform",
    "harness_core.providers",
    "harness_core.resources",
    "harness_core.resources.skills",
    "harness_core.resources.skills.optional",
    "harness_core.runtime",
    "harness_core.skills",
    "harness_core.storage",
    "harness_core.tools",
]

[tool.setuptools.package-dir]
harness_core = "harness_core"
"harness_core.capabilities" = "capabilities"
"harness_core.client" = "hex_cli"
"harness_core.cognition" = "cognition"
"harness_core.core" = "agent"
"harness_core.gateways" = "gateways"
"harness_core.lsp" = "lsp"
"harness_core.models" = "models"
"harness_core.platform" = "hex_platform"
"harness_core.providers" = "providers"
"harness_core.resources" = "resources"
"harness_core.resources.skills" = "skills"
"harness_core.resources.skills.optional" = "optional-skills"
"harness_core.runtime" = "runtime"
"harness_core.skills" = "skill_engine"
"harness_core.storage" = "storage"
"harness_core.tools" = "tools"

[tool.setuptools.package-data]
harness_core = ["migrations/*.sql"]
"harness_core.client" = ["command_catalog.json"]
"harness_core.resources.skills" = [
    "builtin/**/*",
    "builtin/**/.*",
]
"harness_core.resources.skills.optional" = ["**/*", "**/.*"]

[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__/*",
    "**/*.pyc",
    "**/*.pyo",
    "**/.DS_Store",
]
