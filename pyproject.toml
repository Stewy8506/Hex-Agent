[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-ai"
version = "0.22.0"
description = "HEX Agent with CoW durability, Call-Level Journaling, Active Graphify, SkillSpector gate, and Two-Tier model routing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Stewy8506/Harness"
Repository = "https://github.com/Stewy8506/Harness"
Issues = "https://github.com/Stewy8506/Harness/issues"

[project.optional-dependencies]
tui = ["rich>=13.0.0"]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.7.0"]
postgres = ["asyncpg>=0.29.0", "sqlalchemy[asyncio]>=2.0.30,<2.1.0", "alembic>=1.13.0"]
mlx = ["mlx-lm>=0.18.0"]
full = [
    "pytest>=7.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "alembic>=1.13.0",
]
test = [
    "pytest>=7.0.0",
    "networkx>=3.0",
    "httpx>=0.24.0",
    "typing_extensions>=4.6.0",
    "keyring>=24.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.1.0",
    "alembic>=1.13.0",
]

[project.scripts]
hex = "harness_core.client.cli:main"
harness = "harness_core.client.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness_core*"]
# Skill bundles are data, including their scripts, not importable engine packages.
exclude = [
    "harness_core.skills.*",
    "harness_core.optional_skills",
    "harness_core.optional_skills.*",
    "harness_core.resources.skills",
    "harness_core.resources.skills.*",
]

[tool.setuptools.package-data]
harness_core = [
    "migrations/*.sql",
    "client/command_catalog.json",
]
"harness_core.resources" = [
    # Ship every extension and extensionless asset, plus hidden bundle files.
    "skills/builtin/**/*",
    "skills/builtin/**/.*",
    "skills/optional/**/*",
    "skills/optional/**/.*",
]

[tool.setuptools.exclude-package-data]
"harness_core.resources" = [
    "skills/**/__pycache__/*",
    "skills/**/*.pyc",
    "skills/**/*.pyo",
    "skills/**/.DS_Store",
]
