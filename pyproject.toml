[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous-harness"
version = "0.1.0"
description = "Custom Autonomous AI Harness with CoW durability, Call-Level Journaling, Active Graphify, SkillSpector gate, and Harness2 integration"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.7.0"]
postgres = ["asyncpg>=0.29.0", "sqlalchemy[asyncio]>=2.0.30", "alembic>=1.13.0"]
mlx = ["mlx-lm>=0.18.0"]

[project.scripts]
harness = "harness_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness_core*"]
