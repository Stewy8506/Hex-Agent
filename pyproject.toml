[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hex-ai"
version = "0.1.0"
description = "HEX: Autonomous AI Workbench with CoW durability, Call-Level Journaling, Active Graphify, SkillSpector gate, and Two-Tier model routing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/Stewy8506/Harness"
Repository = "https://github.com/Stewy8506/Harness"
Issues = "https://github.com/Stewy8506/Harness/issues"

[project.optional-dependencies]
tui = ["rich>=13.0.0"]
api = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.7.0"]
postgres = ["asyncpg>=0.29.0", "sqlalchemy[asyncio]>=2.0.30", "alembic>=1.13.0"]
mlx = ["mlx-lm>=0.18.0"]
full = [
    "rich>=13.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
]

[project.scripts]
hex = "harness_core.cli:main"
harness = "harness_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["harness_core*"]

[tool.setuptools.package-data]
harness_core = [
    "migrations/*.sql",
    "skills/**/*.md",
    "skills/**/*.yaml",
    "skills/**/*.yml",
]
